name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build bundle
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Skip when the scheduled bundle did not move its gitlink
        id: bundle-change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! -f bundle/Dockerfile ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Generated bundle does not yet include a Dockerfile; skipping."
            exit 0
          fi
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_bundle=$(git ls-tree "$PREVIOUS_SHA" bundle | awk '{print $3}')
          current_bundle=$(git ls-tree HEAD bundle | awk '{print $3}')
          if [[ -n "$previous_bundle" && "$previous_bundle" != "$current_bundle" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundle gitlink unchanged; skipping image publish."
          fi
      - name: Audit frontend dependencies
        if: steps.bundle-change.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
      - name: Set up QEMU
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build image for security scan
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          tags: snip:scan
          load: true
      - name: Scan image for high and critical vulnerabilities
        if: steps.bundle-change.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: snip:scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Log in to GitHub Container Registry
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push scanned image
        if: steps.bundle-change.outputs.changed == 'true'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision="$(git rev-parse --short=7 HEAD)"
          docker tag snip:scan "$image:latest"
          docker tag snip:scan "$image:sha-$revision"
          docker push "$image:sha-$revision"
          docker push "$image:latest"
