name: Build and push image

on:
  push:
    branches:
      - main
    paths:
      - bundle
      - .github/workflows/docker.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build bundle
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and submodules
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0
      - name: Skip when the scheduled bundle did not move its gitlink
        id: bundle-change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$PREVIOUS_SHA"
          previous_bundle=$(git ls-tree "$PREVIOUS_SHA" bundle | awk '{print $3}')
          current_bundle=$(git ls-tree HEAD bundle | awk '{print $3}')
          if [[ -n "$previous_bundle" && "$previous_bundle" != "$current_bundle" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundle gitlink unchanged; skipping image publish."
          fi
      - name: Set up QEMU
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags
        if: steps.bundle-change.outputs.changed == 'true'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push
        if: steps.bundle-change.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          file: ./bundle/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
